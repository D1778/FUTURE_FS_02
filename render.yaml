services:
  - type: web
    name: leadpilot-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      # SPA fallback: serve index.html for client-side routes (/dashboard, /leads/:id) on reload
      - type: rewrite
        source: /*
        destination: /index.html
